<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apify Web App</title>
</head>
<body>
    <h1>Posts de Instagram</h1>
    <button onclick="ejecutarActor()">Ejecutar Actor</button>
    <pre id="resultados">Esperando...</pre>

    <script type="module">
        import { ApifyClient } from 'https://esm.sh/apify-client';

        window.ejecutarActor = async function() {
            const token = window.prompt('Ingresa tu Apify API token (no se guarda):');
            if (!token) return;

            const username = window.prompt('Ingresa el username de Instagram:');
            if (!username) return;

            const client = new ApifyClient({ token });

            // Ejecutar el Actor de Instagram Scraper y esperar resultados
            const run = await client.actor('apify/instagram-scraper').call({
                directUrls: [`https://www.instagram.com/${username}/`],
                resultsType: 'posts',
                resultsLimit: 30,
            });

            // Obtener los items del dataset
            const { items } = await client.dataset(run.defaultDatasetId).listItems();

            document.getElementById('resultados').textContent =
                JSON.stringify(items, null, 2);
        };
    </script>
</body>
</html>
