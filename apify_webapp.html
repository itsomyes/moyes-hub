<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apify Web App</title>
</head>
<body>
    <h1>Resultados de Apify</h1>
    <button onclick="ejecutarActor()">Ejecutar Actor</button>
    <pre id="resultados">Esperando...</pre>

    <script type="module">
        import { ApifyClient } from 'https://esm.sh/apify-client';

        window.ejecutarActor = async function() {
            const token = window.prompt('Ingresa tu Apify API token (no se guarda):');
            if (!token) return;

            const client = new ApifyClient({ token });

            // Ejecutar un Actor y esperar resultados
            const run = await client.actor('apify/web-scraper').call({
                startUrls: [{ url: 'https://example.com' }],
            });

            // Obtener los items del dataset
            const { items } = await client.dataset(run.defaultDatasetId).listItems();

            document.getElementById('resultados').textContent =
                JSON.stringify(items, null, 2);
        };
    </script>
</body>
</html>
